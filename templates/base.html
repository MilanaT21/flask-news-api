<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Новости{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('app.index') }}">Новости</a>
        <div class="d-flex">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('app.dashboard') }}" class="btn btn-outline-light me-2">Мои новости</a>
                <a href="{{ url_for('app.logout') }}" class="btn btn-danger">Выйти</a>
            {% else %}
                <a href="{{ url_for('app.login') }}" class="btn btn-outline-light me-2">Войти</a>
                <a href="{{ url_for('app.register') }}" class="btn btn-success">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-info">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>


</body>
</html>
